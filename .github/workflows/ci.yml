name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*', 'intellij-v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      vscode: ${{ steps.route.outputs.vscode }}
      intellij: ${{ steps.route.outputs.intellij }}
      rust: ${{ steps.route.outputs.rust }}
      publish_vscode: ${{ steps.route.outputs.publish_vscode }}
      publish_intellij: ${{ steps.route.outputs.publish_intellij }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: route
        run: node scripts/ci/detect-changes.cjs

  boundary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate manifest, lockfile and prepared release consistency
        run: node scripts/ci/validate-release.cjs
      - run: npm run test:boundaries

  # ── Extension checks (compile + lint + maintained test suite) ──────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # npm test runs pretest (compile + lint) before the extension tests.
      # build depends on this job, so a failure also blocks publication.
      - name: Compile, lint and test extension
        run: npm test

  # ── Rust unit tests ────────────────────────────────────────────────
  test-rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hprof-analyzer/target
          key: rust-test-${{ hashFiles('hprof-analyzer/Cargo.toml') }}
          restore-keys: rust-test-
      - name: Run Rust tests
        working-directory: hprof-analyzer
        run: cargo test --locked --release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and test standalone browser host (synthetic heaps, mock providers)
        run: |
          cargo build --release --bin heaplens --bin hprof-server --manifest-path hprof-analyzer/Cargo.toml
          npm run compile
          node browser-ui/build.cjs
          node --test browser-ui/test.cjs browser-ui/telemetry.test.cjs
      - name: Test VS Code storage adapter against the built server
        run: |
          HEAPLENS_TEST_SERVER="$GITHUB_WORKSPACE/hprof-analyzer/target/release/hprof-server" \
            node --test out/test/analysisStorage.integration.test.js

  # IntelliJ-only changes cannot publish VS Code. Shared changes test both hosts.
  test-intellij:
    needs: changes
    if: ${{ needs.changes.outputs.intellij == 'true' }}
    runs-on: macos-14
    timeout-minutes: 45
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hprof-analyzer/target
          key: intellij-engine-${{ runner.os }}-${{ hashFiles('hprof-analyzer/Cargo.toml', 'hprof-analyzer/crates/**/Cargo.toml') }}
      - name: Build the shared analysis server
        working-directory: hprof-analyzer
        run: cargo build --release --bin hprof-server
      - name: Fetch the locked dependency graph so the notices task can read it offline
        run: cargo fetch --locked --target aarch64-apple-darwin --manifest-path hprof-analyzer/Cargo.toml
      - name: Require Apple Silicon runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('Apple Silicon runner required')"
      - name: Build and test the exact Apple Silicon package
        shell: bash
        run: |
          FIXTURE_DIR=$(mktemp -d "$RUNNER_TEMP/heaplens-ci.XXXXXX")
          javac -d "$FIXTURE_DIR" hprof-analyzer/tests/fixtures/ClassRetainedCounterexample.java
          java -Xmx128m -cp "$FIXTURE_DIR" ClassRetainedCounterexample "$FIXTURE_DIR/ci-smoke.hprof"
          SERVER="$GITHUB_WORKSPACE/hprof-analyzer/target/release/hprof-server"
          ./intellij-plugin/gradlew -p intellij-plugin --no-daemon buildPlugin verifyPluginProjectConfiguration \
            -PheaplensServerTarget=darwin-arm64 -PheaplensServerBinary="$SERVER"
          PLUGIN_ROOT=$(node intellij-plugin/scripts/extract-built-package.cjs intellij-plugin/build/distributions darwin-arm64)
          ./intellij-plugin/gradlew -p intellij-plugin --no-daemon test verifyPlugin \
            -PheaplensServerTarget=darwin-arm64 -PheaplensServerBinary="$SERVER" \
            -Dheaplens.test.ci=true \
            -Dheaplens.test.server="$PLUGIN_ROOT/native/darwin-arm64/hprof-server" \
            -Dheaplens.test.dump="$FIXTURE_DIR/ci-smoke.hprof" -Dheaplens.test.pluginRoot="$PLUGIN_ROOT"
      - name: Record the candidate checksum next to the ZIP
        working-directory: intellij-plugin/build/distributions
        run: |
          [ "$(ls *-darwin-arm64.zip | wc -l | tr -d ' ')" = 1 ] || { echo '::error::Expected exactly one Apple Silicon ZIP'; exit 1; }
          shasum -a 256 *-darwin-arm64.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: intellij-apple-silicon-candidate
          path: |
            intellij-plugin/build/distributions/*-darwin-arm64.zip
            intellij-plugin/build/distributions/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: intellij-test-reports
          path: |
            intellij-plugin/build/reports/tests/
            intellij-plugin/build/test-results/
            intellij-plugin/build/reports/pluginVerifier/
          retention-days: 7

  # Stable check name for branch protection; selected-but-skipped is a failure.
  checks:
    needs: [changes, boundary-tests, lint, test-rust, test-intellij]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify all selected checks passed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-results.cjs

  # ── Build platform-specific VSIX packages ──────────────────────────
  # OCP: To add a new platform, add one row to matrix.include — nothing else changes.
  build:
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.changes.outputs.vscode == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
            vsce_target: darwin-arm64
            binary: hprof-server
          - os: macos-14
            rust_target: x86_64-apple-darwin
            vsce_target: darwin-x64
            binary: hprof-server
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            vsce_target: linux-x64
            binary: hprof-server
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vsce_target: win32-x64
            binary: hprof-server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hprof-analyzer/target
          key: ${{ matrix.rust_target }}-cargo-${{ hashFiles('hprof-analyzer/Cargo.toml') }}
          restore-keys: ${{ matrix.rust_target }}-cargo-

      - name: Build Rust binary
        working-directory: hprof-analyzer
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Stage binary in bin/
        shell: bash
        run: |
          mkdir -p bin
          cp "hprof-analyzer/target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" bin/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Package VSIX
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
        run: node scripts/ci/vscode-tools.cjs package ${{ matrix.vsce_target }}

      - name: Record the exact platform candidate before upload
        env:
          VSCE_TARGET: ${{ matrix.vsce_target }}
        run: node scripts/ci/vscode-candidate.cjs

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: |
            *.vsix
            vsix-${{ matrix.vsce_target }}.json

  # ── Publish to Marketplace + GitHub Release (tags only) ────────────
  publish:
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.build.result == 'success' && needs.changes.outputs.publish_vscode == 'true' }}
    needs: [changes, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: vscode-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: ${{ runner.temp }}/vscode-candidate

      - name: Publish or safely resume the exact verified platform packages
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/vscode-candidate
          GH_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          HEAPLENS_RELEASE_VERIFY_SECONDS: ${{ vars.HEAPLENS_RELEASE_VERIFY_SECONDS || '900' }}
        run: |
          git fetch --no-tags origin main
          node scripts/ci/release-vscode.cjs

  # ── Publish the verified IntelliJ ZIP (exact intellij-vMAJOR.MINOR.PATCH tags only) ──
  # The ZIP that test-intellij built, tested and verified is uploaded unchanged; nothing is rebuilt here.
  publish-intellij:
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.test-intellij.result == 'success' && needs.changes.outputs.publish_intellij == 'true' }}
    needs: [changes, checks, test-intellij]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: intellij-release # One IntelliJ publication at a time, across tags.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: intellij-apple-silicon-candidate
          path: ${{ runner.temp }}/intellij-candidate
      - name: Publish the tested ZIP to the GitHub release and JetBrains Marketplace
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/intellij-candidate
          GH_TOKEN: ${{ github.token }}
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          git fetch --no-tags origin main
          node scripts/ci/release-intellij.cjs
