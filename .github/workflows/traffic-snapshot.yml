name: Snapshot GitHub Traffic

on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC
  workflow_dispatch:      # allow manual run

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # TRAFFIC_TOKEN is a dedicated fine-grained PAT scoped to this repo with:
      #  - Administration: Read  (required by the Traffic API — GITHUB_TOKEN and
      #    the contents-only PAT_TOKEN both get HTTP 403 here)
      #  - Contents: Read and write  (to commit the CSVs and push to protected main)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Fetch traffic and append yesterday's row
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p traffic

          # Raw 14-day API dumps (overwritten each run — always the freshest window)
          gh api repos/${{ github.repository }}/traffic/clones > traffic/clones-latest.json
          gh api repos/${{ github.repository }}/traffic/views  > traffic/views-latest.json

          YESTERDAY=$(date -u -d 'yesterday' +%Y-%m-%d)

          # Append yesterday's clone row if present and not already recorded
          CLONES_ROW=$(jq -r --arg d "$YESTERDAY" '.clones[]? | select(.timestamp | startswith($d)) | "\(.count),\(.uniques)"' traffic/clones-latest.json)
          if [ -n "$CLONES_ROW" ]; then
            [ ! -f traffic/clones-history.csv ] && echo "date,total,unique" > traffic/clones-history.csv
            grep -q "^$YESTERDAY," traffic/clones-history.csv || echo "$YESTERDAY,$CLONES_ROW" >> traffic/clones-history.csv
          fi

          # Append yesterday's view row if present and not already recorded
          VIEWS_ROW=$(jq -r --arg d "$YESTERDAY" '.views[]? | select(.timestamp | startswith($d)) | "\(.count),\(.uniques)"' traffic/views-latest.json)
          if [ -n "$VIEWS_ROW" ]; then
            [ ! -f traffic/views-history.csv ] && echo "date,total,unique" > traffic/views-history.csv
            grep -q "^$YESTERDAY," traffic/views-history.csv || echo "$YESTERDAY,$VIEWS_ROW" >> traffic/views-history.csv
          fi

          # --- Generate shields.io endpoint badges from accumulated history ---
          # Sums every recorded day, so the totals grow past GitHub's 14-day window.
          make_badge() {
            csv="$1"; label="$2"; col="$3"; out="$4"; color="$5"
            n=0
            [ -f "$csv" ] && n=$(awk -F, -v c="$col" 'NR>1 {s+=$c} END {print s+0}' "$csv")
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' \
              "$label" "$n" "$color" > "$out"
          }
          make_badge traffic/clones-history.csv "clones"         2 traffic/clones-badge.json  blue
          make_badge traffic/clones-history.csv "unique cloners" 3 traffic/cloners-badge.json blueviolet
          make_badge traffic/views-history.csv  "views"          2 traffic/views-badge.json   green
          make_badge traffic/views-history.csv  "unique visitors" 3 traffic/visitors-badge.json brightgreen

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this commit from triggering the CI/CD workflow
            # (which would otherwise auto-bump the version and publish to Marketplace).
            git commit -m "chore(traffic): daily snapshot [skip ci]"
            git push
          fi
