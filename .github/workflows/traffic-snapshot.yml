name: Snapshot GitHub Traffic

on:
  schedule:
    # 12:00 UTC — well after midnight so GitHub has finalized the prior day's
    # traffic bucket. The upsert logic below also self-heals regardless of timing.
    - cron: '0 12 * * *'
  workflow_dispatch:      # allow manual run

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # TRAFFIC_TOKEN is a dedicated fine-grained PAT scoped to this repo with:
      #  - Administration: Read  (required by the Traffic API — GITHUB_TOKEN and
      #    the contents-only PAT_TOKEN both get HTTP 403 here)
      #  - Contents: Read and write  (to commit the CSVs and push to protected main)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Fetch traffic and merge into history
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p traffic

          # Raw 14-day API dumps (overwritten each run — always the freshest window)
          gh api repos/${{ github.repository }}/traffic/clones > traffic/clones-latest.json
          gh api repos/${{ github.repository }}/traffic/views  > traffic/views-latest.json

          # Upsert every day the API currently reports into the history CSV.
          # For any date present in both, the fresh API value wins (self-heals
          # late-finalized or corrected days). Missing days are inserted. Because
          # GitHub always returns the last 14 days, nothing is lost as long as
          # this job runs at least once every 14 days. Output is sorted by date.
          merge() {
            json="$1"; arr="$2"; csv="$3"
            # Fresh API rows: date,total,unique
            jq -r ".${arr}[]? | \"\(.timestamp[:10]),\(.count),\(.uniques)\"" "$json" > /tmp/fresh.csv
            [ -f "$csv" ] || echo "date,total,unique" > "$csv"
            # Existing rows first (skip header), then fresh rows; awk keeps the LAST
            # value seen per date, so fresh API rows override existing ones.
            {
              tail -n +2 "$csv"
              cat /tmp/fresh.csv
            } | awk -F, 'NF>=3 {v[$1]=$2","$3} END {for (d in v) print d","v[d]}' \
              | sort > /tmp/merged.csv
            { echo "date,total,unique"; cat /tmp/merged.csv; } > "$csv"
          }
          merge traffic/clones-latest.json clones traffic/clones-history.csv
          merge traffic/views-latest.json  views  traffic/views-history.csv

          # --- Generate shields.io endpoint badges from accumulated history ---
          # Sums every recorded day, so the totals grow past GitHub's 14-day window.
          make_badge() {
            csv="$1"; label="$2"; col="$3"; out="$4"; color="$5"
            n=0
            [ -f "$csv" ] && n=$(awk -F, -v c="$col" 'NR>1 {s+=$c} END {print s+0}' "$csv")
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' \
              "$label" "$n" "$color" > "$out"
          }
          make_badge traffic/clones-history.csv "clones"         2 traffic/clones-badge.json  blue
          make_badge traffic/clones-history.csv "unique cloners" 3 traffic/cloners-badge.json blueviolet
          make_badge traffic/views-history.csv  "views"          2 traffic/views-badge.json   green
          make_badge traffic/views-history.csv  "unique visitors" 3 traffic/visitors-badge.json brightgreen

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this commit from triggering the CI/CD workflow
            # (which would otherwise auto-bump the version and publish to Marketplace).
            git commit -m "chore(traffic): daily snapshot [skip ci]"
            git push
          fi
